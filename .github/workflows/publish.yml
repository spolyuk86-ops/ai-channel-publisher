name: Publish scheduled post

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
  # Запасний запуск через repository_dispatch.
  # Це корисно, якщо GitHub тимчасово затримує або вимикає schedule.
  repository_dispatch:
    types: [external-trigger]
  workflow_dispatch:
    inputs:
      force_slot:
        description: "Тест: примусово відправити пост цього слоту прямо зараз"
        required: false
        type: choice
        options:
          - ""
          - "08:00"
          - "11:00"
          - "15:00"
        default: ""
      force_day_index:
        description: "Тест: примусово індекс дня циклу 0-29"
        required: false
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Publish post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
          FORCE_DAY_INDEX: ${{ github.event.inputs.force_day_index }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python publish.py
