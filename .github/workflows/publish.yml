name: Publish scheduled post

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force_slot:
        description: "Тест: примусово відправити пост цього слоту прямо зараз (залиште порожнім для звичайного запуску)"
        required: false
        type: choice
        options:
          - ""
          - "08:00"
          - "11:00"
          - "15:00"
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Publish post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          FORCE_SLOT: ${{ github.event.inputs.force_slot }}
        run: python publish.py
